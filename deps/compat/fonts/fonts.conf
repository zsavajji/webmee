<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Minimal fontconfig setup for n9browser.

  The device ships /etc/fonts/fonts.conf written for fontconfig ~2.8; our
  fontconfig 2.15 does not use it (its compiled-in sysconfdir is our own
  prefix), so without this file fontconfig has no configuration at all and
  resolves "sans-serif" to whatever it scans first; observed on device that was
  Courier New, a monospace face. Font selection drives text metrics, so that
  quietly corrupts layout.

  Generic families use mode="prepend" binding="strong" rather than the usual
  <alias><prefer>, because <prefer> is a WEAK binding: with the whole
  /usr/share/fonts tree in scope it still lost to Courier New on device. A
  strong prepend is unambiguous.

  Install to /opt/n9browser/etc/fonts/fonts.conf.
-->
<fontconfig>
  <!-- The device's font tree. -->
  <dir>/usr/share/fonts</dir>

  <!-- Must be writable: /opt is read-only in normal use. -->
  <cachedir>/home/user/.cache/n9browser/fontconfig</cachedir>

  <!-- DejaVu is the only broad-coverage Latin family on the N9; Nokia Pure is
       the system UI face. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <!-- Web-content aliases onto what the device actually has. -->
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
