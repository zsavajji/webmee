<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebMee layout test</title>
<style>
  :root { --accent:#4aa8f2; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 sans-serif; background:#101418; color:#e8eef5; }
  h1 { font-size:18px; margin:12px; color:var(--accent); }
  h2 { font-size:13px; margin:14px 12px 6px; color:#8fa3b8; text-transform:uppercase; letter-spacing:.08em; }

  /* --- flexbox --- */
  .flex { display:flex; gap:8px; padding:0 12px; }
  .flex > div { flex:1; padding:14px 0; text-align:center; border-radius:6px; color:#08111c; font-weight:bold; }
  .f1{background:#4aa8f2} .f2{background:#f2994a} .f3{background:#57d68a}
  .flexgrow { display:flex; gap:8px; padding:8px 12px 0; }
  .flexgrow .a{flex:2;background:#2b3a4a;padding:10px;border-radius:6px}
  .flexgrow .b{flex:1;background:#38506a;padding:10px;border-radius:6px}

  /* --- css grid --- */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:44px;
          gap:8px; padding:0 12px; }
  .grid div { background:#243244; border-radius:6px; display:flex;
              align-items:center; justify-content:center; font-size:12px; }
  .grid .wide { grid-column:span 2; background:#31597f; }
  .grid .tall { grid-row:span 2; background:#3f6f4f; }

  /* --- modern bits that older engines miss --- */
  .mod { margin:10px 12px; padding:10px; border-radius:8px;
         background:linear-gradient(135deg,#1d2a38,#2a3f55); }
  .mod code { color:#9fd0ff; }
</style></head>
<body>
  <h1>WebMee &mdash; layout check</h1>

  <h2>Flexbox</h2>
  <div class="flex"><div class="f1">flex 1</div><div class="f2">flex 1</div><div class="f3">flex 1</div></div>
  <div class="flexgrow"><div class="a">flex: 2</div><div class="b">flex: 1</div></div>

  <h2>CSS Grid</h2>
  <div class="grid">
    <div class="wide">span 2</div>
    <div class="tall">span<br>2 rows</div>
    <div>3</div><div>4</div>
    <div>5</div><div>6</div>
  </div>

  <h2>Modern CSS</h2>
  <div class="mod">
    custom property <code>var(--accent)</code>,
    <code>gap</code>, <code>linear-gradient</code>,
    <code>calc()</code> &rarr; <span style="color:var(--accent)">working</span>
  </div>

  <script>
    // ES6 features QtWebKit 2.2 could never parse
    const facts = [['flex', CSS.supports('display','flex')],
                   ['grid', CSS.supports('display','grid')],
                   ['gap',  CSS.supports('gap','8px')],
                   ['var',  CSS.supports('color','var(--x)')]];
    const line = facts.map(([k,v]) => `${k}:${v?'yes':'NO'}`).join('  ');
    document.title = 'WebMee ' + line;
    const el = document.createElement('div');
    el.className = 'mod';
    el.textContent = 'CSS.supports -> ' + line;
    document.body.appendChild(el);
  </script>
</body></html>
